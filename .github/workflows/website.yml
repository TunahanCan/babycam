name: Marketing Website

on:
  push:
    branches:
      - master
      - main
    paths:
      - website/**
      - PRIVACY.md
      - .github/workflows/website.yml
  pull_request:
    paths:
      - website/**
      - PRIVACY.md
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marketing-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check JavaScript syntax
        run: |
          node --check website/app.js
          node --check website/language-init.js
          node --check website/i18n.js
          node --check website/scripts/validate.mjs
          node --check website/scripts/browser-smoke.mjs

      - name: Validate pages and assets
        run: node website/scripts/validate.mjs

      - name: Run browser smoke test
        run: |
          python3 -m http.server 8080 --directory website > /tmp/miucam-site-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8080/ > /dev/null
          node --experimental-websocket website/scripts/browser-smoke.mjs http://127.0.0.1:8080

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miucam-website-screenshots
          path: /tmp/miucam-browser-smoke/*.png
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble public site
        run: |
          mkdir _site
          find website -maxdepth 1 -type f ! -name 'README.md' -exec cp {} _site/ \;
          cp -R website/assets _site/assets
          cp -R website/locales _site/locales
          touch _site/.nojekyll

      - name: Validate public artifact
        run: SITE_ROOT=_site node website/scripts/validate.mjs

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
