name: Release Gate

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - website/**
  pull_request:
    paths-ignore:
      - website/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up billing backend Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt

      - name: Install billing backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-test.txt

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool/tests

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test billing backend
        working-directory: backend
        run: .venv/bin/python -m pytest -q

      - name: Test backend to room purchase delivery
        env:
          MIUCAM_BACKEND_TEST_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
        run: flutter test tool/tests/purchase_backend_contract_test.dart

      - name: Build billing backend container
        run: docker build -t miucam-billing:ci backend

  android-build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned release bundle
        run: flutter build appbundle --release

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: miucam-android-release-unsigned
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  ios-build:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
