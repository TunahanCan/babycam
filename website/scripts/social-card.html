<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<title>MiuCam sosyal paylaşım kartı kaynağı</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; color: #162033; font-family: Arial, sans-serif; background: radial-gradient(circle at 94% 30%, #dcf1ec, transparent 42%), radial-gradient(circle at 4% 4%, #faeaf2, transparent 42%), #f8f9ff; }
  main { position: relative; height: 100%; padding: 54px 64px; }
  .brand { width: 188px; height: auto; }
  .eyebrow { margin: 38px 0 18px; color: #5350bd; font-size: 16px; font-weight: 700; letter-spacing: 1px; }
  h1 { max-width: 625px; margin: 0 0 24px; font-size: 60px; line-height: 1.08; letter-spacing: -2.5px; }
  h1 span { color: #6257cb; }
  .benefits { max-width: 560px; margin: 0; color: #526075; font-size: 21px; line-height: 1.65; }
  .footer { position: absolute; bottom: 48px; color: #526075; font-size: 15px; }
  .phone { position: absolute; overflow: hidden; border: 6px solid #212537; border-radius: 27px; box-shadow: 0 25px 45px #24334a30; }
  .phone img { display: block; width: 100%; height: auto; }
  .room { top: 156px; left: 734px; width: 184px; transform: rotate(-7deg); }
  .parent { top: 66px; left: 910px; width: 226px; transform: rotate(4deg); }
  .demo { position: absolute; right: 59px; bottom: 34px; color: #657287; font-size: 12px; }
</style>
<main>
  <img class="brand" src="../assets/brand/wordmark-pink.webp" alt="MiuCam" width="760" height="252">
  <p class="eyebrow">İKİ TELEFON · AYNI WI-FI · TEK UYGULAMA</p>
  <h1>Eski telefonun,<br><span>yeni bebek<br>monitörün.</span></h1>
  <p class="benefits">Canlı görüntü, oda sesi ve bas-konuş.<br>Bebek odasını kendi telefonundan takip et.</p>
  <p class="footer">Android &amp; iPhone · Mağaza sürümü hazırlanıyor</p>
  <div class="phone room"><img src="../assets/screens/server-preview.webp" alt="Oda telefonu" width="390" height="844"></div>
  <div class="phone parent"><img src="../assets/screens/client-live.webp" alt="Ebeveyn telefonu" width="390" height="844"></div>
  <p class="demo">Güncel uygulama ekranları · Örnek yayın</p>
</main>
</html>
